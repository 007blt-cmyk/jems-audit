<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ביקור סניף · ג'מס</title>
<meta name="theme-color" content="#16120d" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ביקור סניף">
<script>
  // theme before paint: saved choice, else device setting
  (function () {
    var t = null;
    try { t = localStorage.getItem('jems-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app" aria-live="polite">
  <div class="boot"><div class="mark">J</div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
